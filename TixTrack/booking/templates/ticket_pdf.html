<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tixtrack Ticket</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #e8ecf1;
            padding: 40px 20px;
        }

        .ticket-container {
            max-width: 480px;
            margin: 0 auto;
        }
        
        .ticket-card {
            max-width: 500px;
            margin: 0 auto;
            background: #fefefe;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        
        /* Logo Section */
        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo-text {
            font-size: 42px;
            font-weight: bold;
            color: #2d1b4e;
            letter-spacing: 1px;
        }
        
        .logo-butterfly {
            color: #ff8c42;
            font-size: 28px;
        }
        
        /* QR Code Section */
        .qr-section {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .qr-section img {
            width: 180px;
            height: 180px;
            margin: 10px auto;
            display: block;
        }
        
        .booking-id {
            font-size: 14px;
            color: #666;
            margin: 15px 0 8px 0;
        }
        
        .scan-text {
            font-size: 13px;
            color: #888;
            margin-bottom: 30px;
        }
        
        /* Concert Title */
        .concert-title {
            font-size: 32px;
            font-weight: bold;
            color: #2d2d2d;
            text-align: center;
            margin-bottom: 30px;
        }
        
        /* Info Rows */
        .info-item {
            display: table;
            width: 100%;
            margin-bottom: 18px;
        }
        
        .info-icon {
            display: table-cell;
            width: 40px;
            vertical-align: middle;
            color: #666;
            font-size: 18px;
        }
        
        .info-text {
            /* display: table-cell; */
            vertical-align: middle;
            color: #4a4a4a;
            font-size: 15px;
            padding-left: 5px;
        }
        
        /* Icons using Unicode symbols */
        .icon-artist::before {
            font-size: 18px;
        }
        
        .icon-category::before {
            font-size: 18px;
        }
        
        .icon-location::before {
            font-size: 18px;
        }
        
        .icon-datetime::before {
            font-size: 18px;
        }
                
    </style>

    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    

</head>
<body>

    <div class="ticket-container">
        <div class="ticket-card">
            
            <div class="logo-section">
                <div class="logo-text">
                    <!-- Tixtrack<span class="logo-butterfly">🦋</span> -->
                    <img src="{{ logo }}" alt="Tixtrack Logo" style="max-width: 150px;">
                </div>
            </div>
            
            <div class="qr-section">
                <img src="{{ qr_code }}" alt="QR Code">
                <p class="booking-id">Booking ID: {{ booking.id }}</p>
                <p class="scan-text">Scan this QR code at the concert</p>
            </div>
            
            <div class="concert-title">{{ concert.concert_name }}</div>
            
            <div class="info-item">
                <div class="info-icon icon-artist"><i className="bi bi-person-video"></i></div>
                <div class="info-text">{{ concert.artists }}</div>
            </div>
            
            <div class="info-item">
                <div class="info-icon icon-category"><i className="bi bi-bookmark"></i></div>
                <div class="info-text">{{ concert.category }}</div>
            </div>
            
            <div class="info-item">
                <div class="info-icon icon-location"><i className="bi bi-geo-alt"></i></div>
                <div class="info-text">{{ concert.venue }}</div>
            </div>
            
            <div class="info-item">
                <div class="info-icon icon-datetime"><i className="bi bi-calendar"></i></div>
                <!-- <div class="info-text">{{ concert.date|date:"d/m/Y" }}, {{ concert.time|time:"H:i" }}</div> -->
                <div class="info-text">{{ concert.date_time|date:"D, d M Y • h:i A"|default:"—" }}</div>
            </div>
        </div>
    </div>
</body>
</html>
